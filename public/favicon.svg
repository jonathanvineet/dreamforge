<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="df-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <linearGradient id="df-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <linearGradient id="df-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="120" fill="url(#df-dark)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="url(#df-cyan)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Isometric 3D Print Bed Grid Accent -->
  <path d="M 256,60 L 436,164 L 436,372 L 256,476 L 76,372 L 76,164 Z" fill="none" stroke="url(#df-cyan)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Top Face - 3D Printing Layer -->
    <path d="M 256,110 L 376,178 L 256,246 L 136,178 Z" fill="url(#df-cyan)" opacity="0.9" />
    <path d="M 256,128 L 350,181 L 256,234 L 162,181 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6" />

    <!-- Left Face - Forge Structure -->
    <path d="M 136,178 L 256,246 L 256,384 L 136,316 Z" fill="url(#df-gold)" opacity="0.85" />

    <!-- Right Face - Precision Extruder Chamber -->
    <path d="M 256,246 L 376,178 L 376,316 L 256,384 Z" fill="url(#df-cyan)" opacity="0.75" />

    <!-- Central Glowing Core Nozzle -->
    <path d="M 256,190 L 290,240 L 256,290 L 222,240 Z" fill="#FFFFFF" opacity="0.95" />
    <circle cx="256" cy="240" r="12" fill="#00F0FF" />

    <!-- Futuristic Layer Lines -->
    <line x1="136" y1="212" x2="256" y2="280" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <line x1="136" y1="246" x2="256" y2="314" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <line x1="136" y1="280" x2="256" y2="348" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />

    <line x1="376" y1="212" x2="256" y2="280" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <line x1="376" y1="246" x2="256" y2="314" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
    <line x1="376" y1="280" x2="256" y2="348" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
  </g>
</svg>
